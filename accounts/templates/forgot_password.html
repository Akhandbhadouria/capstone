{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - ClassAudit AI</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link rel="stylesheet" href="{% static 'css/principal_register.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        .split-container { display: flex; min-height: 100vh; }
        .visual-side { flex: 1; background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); display: flex; align-items: center; justify-content: center; }
        .form-side { flex: 1; display: flex; align-items: center; justify-content: center; padding: 2rem; background: #fff; }
        .status-message { padding: 12px 16px; border-radius: 10px; margin-bottom: 1rem; display: none; font-size: 0.9rem; }
        .status-message.success { background: #e8f5e9; color: #2e7d32; display: block; }
        .status-message.error { background: #ffebee; color: #c62828; display: block; }
        @media (max-width: 768px) { .visual-side { display: none; } }
    </style>
</head>
<body>
    <div class="split-container">
        <div class="visual-side">
            <div style="color:white; text-align:center; padding:2rem;">
                <i class="fas fa-lock-open" style="font-size:5rem; margin-bottom:1rem; opacity:0.9;"></i>
                <h2 style="font-size:2rem; font-weight:800;">Forgot Password?</h2>
                <p style="opacity:0.8; font-size:1.1rem; margin-top:0.5rem;">No worries! We'll send an OTP to reset it.</p>
            </div>
        </div>
        <div class="form-side">
            <div class="form-container">
                <a href="/" class="brand-logo"><i class="fas fa-cube"></i> ClassAudit AI</a>
                <h1>Reset Password</h1>
                <p class="subtitle">Enter your registered email address.</p>

                <div id="statusMsg" class="status-message"></div>

                <form id="forgotForm" onsubmit="submitForm(event)">
                    {% csrf_token %}
                    <div class="input-group">
                        <label>Email Address</label>
                        <input type="email" name="email" class="input-field" placeholder="Enter your registered email" required autofocus>
                    </div>
                    <button type="submit" id="submitBtn" class="btn-primary">
                        <i class="fas fa-paper-plane"></i> Send OTP
                    </button>
                </form>

                <div class="footer-text" style="margin-top:1.5rem;">
                    <a href="/principal/login/">Back to Principal Login</a> &nbsp;|&nbsp;
                    <a href="/teacher/login-password/">Back to Teacher Login</a>
                </div>
            </div>
        </div>
    </div>
    <script>
        function submitForm(e) {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const msg = document.getElementById('statusMsg');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Sending...';
            const formData = new FormData(document.getElementById('forgotForm'));
            fetch('/forgot-password/', {
                method: 'POST',
                headers: {'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]').value},
                body: formData
            })
            .then(r => r.json())
            .then(data => {
                msg.className = 'status-message ' + data.status;
                msg.textContent = data.message;
                if (data.status === 'success') {
                    setTimeout(() => window.location.href = data.redirect, 1200);
                } else {
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fas fa-paper-plane"></i> Send OTP';
                }
            });
        }
    </script>
</body>
</html>
