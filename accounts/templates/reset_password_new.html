{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Password - ClassAudit AI</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link rel="stylesheet" href="{% static 'css/principal_register.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        .split-container { display: flex; min-height: 100vh; }
        .visual-side { flex: 1; background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%); display: flex; align-items: center; justify-content: center; }
        .form-side { flex: 1; display: flex; align-items: center; justify-content: center; padding: 2rem; background: #fff; }
        .status-message { padding: 12px; border-radius: 8px; margin-bottom: 1rem; display: none; }
        .status-message.success { background: #e8f5e9; color: #2e7d32; display: block; }
        .status-message.error { background: #ffebee; color: #c62828; display: block; }
        .password-strength { height: 4px; border-radius: 2px; margin-top: 6px; transition: 0.3s; background: #e0e0e0; }
        .strength-weak { background: #ef5350; width: 33%; }
        .strength-medium { background: #ff9800; width: 66%; }
        .strength-strong { background: #4caf50; width: 100%; }
        @media (max-width: 768px) { .visual-side { display: none; } }
    </style>
</head>
<body>
    <div class="split-container">
        <div class="visual-side">
            <div style="color:white; text-align:center; padding:2rem;">
                <i class="fas fa-shield-alt" style="font-size:5rem; margin-bottom:1rem; opacity:0.9;"></i>
                <h2 style="font-size:2rem; font-weight:800;">Almost Done!</h2>
                <p style="opacity:0.8; margin-top:0.5rem;">Create a strong new password</p>
            </div>
        </div>
        <div class="form-side">
            <div class="form-container">
                <a href="/" class="brand-logo"><i class="fas fa-cube"></i> ClassAudit AI</a>
                <h1>New Password</h1>
                <p class="subtitle">Enter your new password below.</p>

                <div id="statusMsg" class="status-message"></div>

                <form id="resetForm" onsubmit="submitForm(event)">
                    {% csrf_token %}
                    <div class="input-group">
                        <label>New Password</label>
                        <input type="password" name="password1" id="password1" class="input-field" placeholder="Min 8 chars, letters + numbers" required oninput="checkStrength(this.value)">
                        <div class="password-strength" id="strengthBar"></div>
                    </div>
                    <div class="input-group">
                        <label>Confirm Password</label>
                        <input type="password" name="password2" class="input-field" placeholder="Re-enter password" required>
                    </div>
                    <button type="submit" id="submitBtn" class="btn-primary">
                        <i class="fas fa-lock"></i> Reset Password
                    </button>
                </form>
            </div>
        </div>
    </div>
    <script>
        function checkStrength(val) {
            const bar = document.getElementById('strengthBar');
            bar.className = 'password-strength';
            if (!val) return;
            const hasLetter = /[a-zA-Z]/.test(val);
            const hasNum = /[0-9]/.test(val);
            const isLong = val.length >= 10;
            if (val.length < 6) bar.classList.add('strength-weak');
            else if (hasLetter && hasNum && isLong) bar.classList.add('strength-strong');
            else if (hasLetter && hasNum) bar.classList.add('strength-medium');
            else bar.classList.add('strength-weak');
        }
        function submitForm(e) {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const msg = document.getElementById('statusMsg');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Resetting...';
            const formData = new FormData(document.getElementById('resetForm'));
            fetch('/reset-password-new/', { method:'POST', headers:{'X-CSRFToken':document.querySelector('[name=csrfmiddlewaretoken]').value}, body: formData })
            .then(r=>r.json()).then(data=>{
                msg.className = 'status-message ' + data.status;
                msg.textContent = data.message;
                if (data.status === 'success') {
                    setTimeout(() => window.location.href = data.redirect, 1500);
                } else {
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fas fa-lock"></i> Reset Password';
                }
            });
        }
    </script>
</body>
</html>
